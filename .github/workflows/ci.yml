name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          version: '3.12'

      - name: Install linting tools
        run: python3 -m pip install flake8

      - name: Python lint - hello-lambda
        run: flake8 app/app.py --max-line-length=120 --ignore=E501,W503

      - name: Build Docker image - hello-lambda
        run: docker buildx build --platform linux/amd64 --provenance=false -t devops/hello-lambda:test app/

      - name: Test Lambda handler imports - hello-lambda
        run: |
          docker run --rm --entrypoint python devops/hello-lambda:test python -c "import app; print('hello-lambda handler OK')"
